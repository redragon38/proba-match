services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchscore
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["football-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
volumes:
  football-data:
