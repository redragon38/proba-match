worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m max_size=512m inactive=1h use_temp_path=off;
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=256m inactive=7d use_temp_path=off;

  map $request_uri $skip_page_cache {
    default 0;
    ~^/api/ 1;
    ~^/admin(?:/|$) 1;
    ~^/recherche(?:\?|$) 1;
    ~^/favoris(?:\?|$) 1;
    ~^/parametres(?:\?|$) 1;
  }

  server {
    listen 8080;
    server_name _;

    location /_next/static/ {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_cache static;
      proxy_cache_valid 200 7d;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Proba-Cache $upstream_cache_status always;
    }

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;

      proxy_cache pages;
      proxy_cache_methods GET HEAD;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_bypass $skip_page_cache;
      proxy_no_cache $skip_page_cache $upstream_http_set_cookie;
      proxy_ignore_headers Cache-Control Expires;
      proxy_cache_valid 200 60s;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 10s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Proba-Cache $upstream_cache_status always;
    }
  }
}
