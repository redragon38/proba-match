name: Vérification
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: proba_match_ci_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/proba_match_ci_e2e
      CRON_SECRET: ci-test-cron-secret-not-a-production-secret
      ADMIN_SECRET: ci-test-admin-secret-not-a-production-secret
      NEXT_PUBLIC_SITE_URL: https://proba-match.vercel.app
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:seed
      - run: npm run test:e2e
      - run: node scripts/verify-empty-states.mjs
      - name: Audit SEO du build de production
        shell: bash
        run: |
          npm run start > /tmp/matchscore-seo.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:seo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit
          path: artifacts/seo-audit.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  database-ui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/postgres
      FOOTBALL_VERIFY_UI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:football-db
