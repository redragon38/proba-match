services:
  migrate:
    build:
      context: .
      target: builder
    env_file: .env.vps
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file: .env.vps
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Keep enough CPU reserved for public SSR while background imports are active.
    cpus: 1.50
    healthcheck:
      # Report transient saturation without killing PID 1 and creating a restart loop.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz.txt',{signal:AbortSignal.timeout(8000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s

  worker:
    build:
      context: .
      target: runner
    env_file: .env.vps
    restart: unless-stopped
    cpus: 1.00
    # Background imports can monopolize their own CPU allocation; they must not
    # supervise or replace the public application process.
    command: ["node", "server.js"]
    healthcheck:
      # Imports can saturate the worker CPU for several minutes. The application
      # container handles public traffic; only verify that the worker process is alive.
      test: ["CMD", "node", "-e", "process.kill(1,0)"]
      interval: 15s
      timeout: 6s
      retries: 2
      start_period: 30s

  cache:
    image: nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz.txt"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      cache:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    env_file: .env.vps
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  nginx-cache:
